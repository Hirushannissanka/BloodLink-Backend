server:
  port: 8082

spring:
  application:
    name: request-service
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-at-least-32-chars}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  services:
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    notification-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
